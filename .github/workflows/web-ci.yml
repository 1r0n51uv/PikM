name: web-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pikm/shared typecheck
      - run: pnpm --filter @pikm/web lint
      - run: pnpm --filter @pikm/web typecheck
      - run: pnpm --filter @pikm/web build
